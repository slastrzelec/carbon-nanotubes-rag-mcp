name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Tests with coverage gate (fail under 90%)
        run: pytest --cov --cov-report=term-missing

  mutation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Known security bugs must fail the suite
        run: python scripts/mutation_check.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Known vulnerabilities in installed dependencies
        run: pip-audit --skip-editable

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-mcp:ci .
      - name: Container refuses to start without a token
        run: |
          if docker run --rm rag-mcp:ci; then echo "started without token"; exit 1; fi
      - name: Container serves HTTP, requires the token, runs as non-root
        run: |
          TOKEN=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          docker run -d --name mcp -p 127.0.0.1:8765:8765 -e RAG_MCP_HTTP_TOKEN="$TOKEN" rag-mcp:ci
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8765/mcp && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8765/mcp)" = "401"
          test "$(docker exec mcp id -u)" = "10001"
          if docker logs mcp 2>&1 | grep -F "$TOKEN"; then echo "token leaked to logs"; exit 1; fi
          docker rm -f mcp
